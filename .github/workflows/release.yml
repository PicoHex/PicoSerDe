name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_VERSION: 10.0.x
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  # The release gate. v2026.11.0 shipped while CI had been red for three days,
  # because this workflow used to be `pack -> publish` with nothing between the
  # tag and NuGet. `pack` now needs this job, so a red test here stops the release
  # before a single .nupkg is built.
  #
  # One platform, deliberately. The steps below are the linux-x64 leg of ci.yml,
  # command for command: same restore, same Release build, same per-project
  # `dotnet run` shape (TUnit on Microsoft.Testing.Platform; see the tunit-runner
  # skill). The question this gate answers is "are the packed bits wrong?", and
  # the shipped source is platform-neutral -- no `#if WINDOWS/OSX/LINUX` in the
  # tree, and no OperatingSystem/RuntimeInformation use in product or test code --
  # so a second OS would re-run the same managed tests on a slower runner. The
  # five-platform matrix, the AOT validation and the benchmark canary stay in CI,
  # where they belong: they are the axes whose red can be the runner's environment
  # rather than the release's correctness. CI is still the pre-tag check (see
  # AGENTS.md, "Releasing"); this job is the backstop that makes a red tag
  # impossible to publish.
  verify:
    runs-on: ubuntu-latest
    # Same ceiling as the ci.yml matrix leg, so a hung test cannot eat GitHub's 6h default.
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Restore
        run: |
          mkdir -p ./artifacts/nupkg
          dotnet restore -p:UseProjectReferences=true
      - run: dotnet build --configuration Release --no-restore -p:UseProjectReferences=true
      - name: Run PicoSerDe.Core tests
        run: dotnet run --project PicoSerDe.Core/tests/PicoSerDe.Core.Tests/PicoSerDe.Core.Tests.csproj -c Release --no-build -p:PublishAot=false
      - name: Run PicoJetson.Unit tests
        run: dotnet run --project PicoJetson/tests/PicoJetson.Unit.Tests/PicoJetson.Unit.Tests.csproj -c Release --no-build -p:PublishAot=false
      - name: Run PicoJetson.Integration tests
        run: dotnet run --project PicoJetson/tests/PicoJetson.Integration.Tests/PicoJetson.Integration.Tests.csproj -c Release --no-build -p:PublishAot=false
      - name: Run PicoJetson.Functional tests
        run: dotnet run --project PicoJetson/tests/PicoJetson.Functional.Tests/PicoJetson.Functional.Tests.csproj -c Release --no-build -p:PublishAot=false
      - name: Run PicoIni tests
        run: dotnet run --project PicoIni/tests/PicoIni.Tests/PicoIni.Tests.csproj -c Release --no-build -p:PublishAot=false
      - name: Run PicoMsgPack tests
        run: dotnet run --project PicoMsgPack/tests/PicoMsgPack.Tests/PicoMsgPack.Tests.csproj -c Release --no-build -p:PublishAot=false
      - name: Run PicoToml tests
        run: dotnet run --project PicoToml/tests/PicoToml.Tests/PicoToml.Tests.csproj -c Release --no-build -p:PublishAot=false
      - name: Run PicoYaml tests
        run: dotnet run --project PicoYaml/tests/PicoYaml.Tests/PicoYaml.Tests.csproj -c Release --no-build -p:PublishAot=false
      - name: Run cross-format integration tests
        run: dotnet run --project tests/PicoSerDe.Integration.Tests/PicoSerDe.Integration.Tests.csproj -c Release --no-build -p:PublishAot=false
      - name: Run benchmark protocol tests
        run: dotnet run --project tests/PicoBench.Protocol.Tests/PicoBench.Protocol.Tests.csproj -c Release --no-build -p:PublishAot=false

  pack:
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
      # Tier 2 pack order: Abstractions → Generator → Consumer
      - shell: bash
        run: |
          rm -rf ${{ github.workspace }}/artifacts/nupkg
          mkdir -p ${{ github.workspace }}/artifacts/nupkg

          dotnet pack PicoSerDe.Core/src/PicoSerDe.Core.csproj \
            --configuration Release \
            --output ${{ github.workspace }}/artifacts/nupkg \
            -p:Version=${{ steps.version.outputs.VERSION }} \
            -p:UseProjectReferences=false

          dotnet pack PicoJetson/src/PicoJetson.Gen/PicoJetson.Gen.csproj \
            --configuration Release \
            --output ${{ github.workspace }}/artifacts/nupkg \
            -p:Version=${{ steps.version.outputs.VERSION }} \
            -p:UseProjectReferences=false \
            -p:RestoreAdditionalProjectSources=${{ github.workspace }}/artifacts/nupkg

          dotnet pack PicoJetson/src/PicoJetson/PicoJetson.csproj \
            --configuration Release \
            --output ${{ github.workspace }}/artifacts/nupkg \
            -p:Version=${{ steps.version.outputs.VERSION }} \
            -p:UseProjectReferences=false \
            -p:RestoreAdditionalProjectSources=${{ github.workspace }}/artifacts/nupkg

          dotnet pack PicoIni/src/PicoIni.Gen/PicoIni.Gen.csproj \
            --configuration Release \
            --output ${{ github.workspace }}/artifacts/nupkg \
            -p:Version=${{ steps.version.outputs.VERSION }} \
            -p:UseProjectReferences=false \
            -p:RestoreAdditionalProjectSources=${{ github.workspace }}/artifacts/nupkg

          dotnet pack PicoIni/src/PicoIni/PicoIni.csproj \
            --configuration Release \
            --output ${{ github.workspace }}/artifacts/nupkg \
            -p:Version=${{ steps.version.outputs.VERSION }} \
            -p:UseProjectReferences=false \
            -p:RestoreAdditionalProjectSources=${{ github.workspace }}/artifacts/nupkg

          dotnet pack PicoToml/src/PicoToml.Gen/PicoToml.Gen.csproj \
            --configuration Release \
            --output ${{ github.workspace }}/artifacts/nupkg \
            -p:Version=${{ steps.version.outputs.VERSION }} \
            -p:UseProjectReferences=false \
            -p:RestoreAdditionalProjectSources=${{ github.workspace }}/artifacts/nupkg

          dotnet pack PicoToml/src/PicoToml/PicoToml.csproj \
            --configuration Release \
            --output ${{ github.workspace }}/artifacts/nupkg \
            -p:Version=${{ steps.version.outputs.VERSION }} \
            -p:UseProjectReferences=false \
            -p:RestoreAdditionalProjectSources=${{ github.workspace }}/artifacts/nupkg

          dotnet pack PicoYaml/src/PicoYaml.Gen/PicoYaml.Gen.csproj \
            --configuration Release \
            --output ${{ github.workspace }}/artifacts/nupkg \
            -p:Version=${{ steps.version.outputs.VERSION }} \
            -p:UseProjectReferences=false \
            -p:RestoreAdditionalProjectSources=${{ github.workspace }}/artifacts/nupkg

          dotnet pack PicoYaml/src/PicoYaml/PicoYaml.csproj \
            --configuration Release \
            --output ${{ github.workspace }}/artifacts/nupkg \
            -p:Version=${{ steps.version.outputs.VERSION }} \
            -p:UseProjectReferences=false \
            -p:RestoreAdditionalProjectSources=${{ github.workspace }}/artifacts/nupkg

          dotnet pack PicoMsgPack/src/PicoMsgPack.Gen/PicoMsgPack.Gen.csproj \
            --configuration Release \
            --output ${{ github.workspace }}/artifacts/nupkg \
            -p:Version=${{ steps.version.outputs.VERSION }} \
            -p:UseProjectReferences=false \
            -p:RestoreAdditionalProjectSources=${{ github.workspace }}/artifacts/nupkg

          dotnet pack PicoMsgPack/src/PicoMsgPack/PicoMsgPack.csproj \
            --configuration Release \
            --output ${{ github.workspace }}/artifacts/nupkg \
            -p:Version=${{ steps.version.outputs.VERSION }} \
            -p:UseProjectReferences=false \
            -p:RestoreAdditionalProjectSources=${{ github.workspace }}/artifacts/nupkg

      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: |
            ${{ github.workspace }}/artifacts/nupkg/*.nupkg
            ${{ github.workspace }}/artifacts/nupkg/*.snupkg

  publish:
    runs-on: ubuntu-latest
    needs: pack
    environment: release
    permissions:
      contents: write
      # GitHub OIDC: lets this job mint the identity token nuget.org trades for a
      # short-lived API key. Without it the login step has nothing to present.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nupkg
          path: nupkg
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
      - shell: bash
        working-directory: nupkg
        run: |
          for file in *.nupkg; do
            if [[ "$file" != *.snupkg ]] && [[ "$file" != *.symbols.nupkg ]]; then
              dotnet nuget push "$file" \
                --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
                --source https://api.nuget.org/v3/index.json \
                --skip-duplicate
            fi
          done
      - name: Extract version
        shell: bash
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: PicoSerDe v${{ steps.version.outputs.VERSION }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          make_latest: true
          files: |
            nupkg/*.nupkg
            nupkg/*.snupkg
