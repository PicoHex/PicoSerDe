name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: 10.0.x
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - logical-target: win-x64
            runs-on: windows-latest
          - logical-target: win-arm64
            runs-on: windows-latest
          - logical-target: linux-x64
            runs-on: ubuntu-latest
          - logical-target: linux-arm64
            runs-on: ubuntu-24.04-arm
          - logical-target: osx-arm64
            runs-on: macos-latest
    runs-on: ${{ matrix.runs-on }}
    # Fail fast instead of letting a hung test run to GitHub's 6h default limit.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Show logical target
        run: echo "Testing ${{ matrix.logical-target }}"
      - name: Restore
        run: |
          mkdir -p ./artifacts/nupkg
          dotnet restore -p:UseProjectReferences=true
      - run: dotnet build --configuration Release --no-restore -p:UseProjectReferences=true
      # TUnit on Microsoft.Testing.Platform: `dotnet test` shows flaky test
      # discovery in this repo, so each test project is executed directly with
      # `dotnet run` (see the tunit-runner skill).
      - name: Run PicoSerDe.Core tests
        run: dotnet run --project PicoSerDe.Core/tests/PicoSerDe.Core.Tests/PicoSerDe.Core.Tests.csproj -c Release --no-build -p:PublishAot=false
      - name: Run PicoJetson.Unit tests
        run: dotnet run --project PicoJetson/tests/PicoJetson.Unit.Tests/PicoJetson.Unit.Tests.csproj -c Release --no-build -p:PublishAot=false
      - name: Run PicoJetson.Integration tests
        run: dotnet run --project PicoJetson/tests/PicoJetson.Integration.Tests/PicoJetson.Integration.Tests.csproj -c Release --no-build -p:PublishAot=false
      - name: Run PicoJetson.Functional tests
        run: dotnet run --project PicoJetson/tests/PicoJetson.Functional.Tests/PicoJetson.Functional.Tests.csproj -c Release --no-build -p:PublishAot=false
      - name: Run PicoIni tests
        run: dotnet run --project PicoIni/tests/PicoIni.Tests/PicoIni.Tests.csproj -c Release --no-build -p:PublishAot=false
      - name: Run PicoMsgPack tests
        run: dotnet run --project PicoMsgPack/tests/PicoMsgPack.Tests/PicoMsgPack.Tests.csproj -c Release --no-build -p:PublishAot=false
      - name: Run PicoToml tests
        run: dotnet run --project PicoToml/tests/PicoToml.Tests/PicoToml.Tests.csproj -c Release --no-build -p:PublishAot=false
      - name: Run PicoYaml tests
        run: dotnet run --project PicoYaml/tests/PicoYaml.Tests/PicoYaml.Tests.csproj -c Release --no-build -p:PublishAot=false
      - name: Run cross-format integration tests
        run: dotnet run --project tests/PicoSerDe.Integration.Tests/PicoSerDe.Integration.Tests.csproj -c Release --no-build -p:PublishAot=false
      - name: Run benchmark protocol tests
        run: dotnet run --project tests/PicoBench.Protocol.Tests/PicoBench.Protocol.Tests.csproj -c Release --no-build -p:PublishAot=false
      - run: dotnet build PicoJetson/benchmarks/PicoJetson.Benchmarks/PicoJetson.Benchmarks.csproj -c Release --no-restore
      - run: dotnet build PicoIni/benchmarks/PicoIni.Benchmarks/PicoIni.Benchmarks.csproj -c Release --no-restore
      - run: dotnet build PicoToml/benchmarks/PicoToml.Benchmarks/PicoToml.Benchmarks.csproj -c Release --no-restore
      - run: dotnet build PicoYaml/benchmarks/PicoYaml.Benchmarks/PicoYaml.Benchmarks.csproj -c Release --no-restore
      - run: dotnet build PicoMsgPack/benchmarks/PicoMsgPack.Benchmarks/PicoMsgPack.Benchmarks.csproj -c Release --no-restore
      - run: dotnet build PicoMsgPack/benchmarks/PicoMsgPack.Benchmarks.Aot/PicoMsgPack.Benchmarks.Aot.csproj -c Release --no-restore
      # The five smoke steps below carry PICOBENCH_ALLOW_ZERO_PUBLISH=1, and only that one:
      # the protocol exits 1 when a run publishes nothing, which is right for a published
      # figure and wrong as a code-health gate. A refusal is an environment signal (probe
      # drift 20%, spread 3.0x, or other processes above 35% CPU) on a shared 2-4 vCPU
      # runner, and 25 independent processes per PR would turn that into a flaky red --
      # whose first fix is `continue-on-error: true`, i.e. no signal at all. The escape
      # hatch moves the exit code, never a number: PICOBENCH_ALLOW_UNKNOWN_CPU is
      # deliberately NOT set here, because that one publishes figures from a host whose load
      # cannot be verified. The zero-publish signal is kept alive in two places instead:
      # the `PICOBENCH_SUMMARY` line goes into the job page (visible, not buried), and the
      # linux-x64 canary step below still fails outright when nothing was published.
      - name: Run PicoJetson benchmarks (smoke)
        shell: bash
        env:
          PICOBENCH_ALLOW_ZERO_PUBLISH: 1
        run: |
          dotnet run --project PicoJetson/benchmarks/PicoJetson.Benchmarks -c Release --no-build | tee picojetson-smoke.txt
          grep PICOBENCH_SUMMARY picojetson-smoke.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Run PicoIni benchmarks (smoke)
        shell: bash
        env:
          PICOBENCH_ALLOW_ZERO_PUBLISH: 1
        run: |
          dotnet run --project PicoIni/benchmarks/PicoIni.Benchmarks -c Release --no-build | tee picoini-smoke.txt
          grep PICOBENCH_SUMMARY picoini-smoke.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Run PicoToml benchmarks (smoke)
        shell: bash
        env:
          PICOBENCH_ALLOW_ZERO_PUBLISH: 1
        run: |
          dotnet run --project PicoToml/benchmarks/PicoToml.Benchmarks -c Release --no-build | tee picotoml-smoke.txt
          grep PICOBENCH_SUMMARY picotoml-smoke.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Run PicoYaml benchmarks (smoke)
        shell: bash
        env:
          PICOBENCH_ALLOW_ZERO_PUBLISH: 1
        run: |
          dotnet run --project PicoYaml/benchmarks/PicoYaml.Benchmarks -c Release --no-build | tee picoyaml-smoke.txt
          grep PICOBENCH_SUMMARY picoyaml-smoke.txt >> "$GITHUB_STEP_SUMMARY"
      # JIT only: the unified MsgPack benchmark cannot run under NativeAOT (see its csproj).
      - name: Run PicoMsgPack benchmarks (smoke)
        shell: bash
        env:
          PICOBENCH_ALLOW_ZERO_PUBLISH: 1
        run: |
          dotnet run --project PicoMsgPack/benchmarks/PicoMsgPack.Benchmarks -c Release --no-build | tee picomsgpack-smoke.txt
          grep PICOBENCH_SUMMARY picomsgpack-smoke.txt >> "$GITHUB_STEP_SUMMARY"

      # The one canary, on the leg that is most predictable: a GitHub-hosted
      # ubuntu-latest runner is a dedicated VM, so its /proc/stat is the VM's own view
      # (observed other-CPU floor there: 4-20%). No PICOBENCH_ALLOW_ZERO_PUBLISH on this
      # step, and an extra assertion on the summary line, so a benchmark that publishes
      # nothing at all still fails the build -- the other 24 processes would not notice.
      - name: Benchmark canary — at least one arm must publish
        if: matrix.logical-target == 'linux-x64'
        shell: bash
        run: |
          # `set +e` so the summary line still reaches the job page when the run fails.
          set +e
          dotnet run --project PicoJetson/benchmarks/PicoJetson.Benchmarks -c Release --no-build | tee canary.txt
          smoke_exit=$?
          set -e
          grep PICOBENCH_SUMMARY canary.txt >> "$GITHUB_STEP_SUMMARY" || true
          if [ "$smoke_exit" -ne 0 ]; then
            echo "::error::the benchmark canary exited $smoke_exit — a refused or broken run, see the PICOBENCH_SUMMARY line in the job summary"
            exit "$smoke_exit"
          fi
          grep -qE 'PICOBENCH_SUMMARY .*published=[1-9]' canary.txt

  aot-validation:
    needs: build-and-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - logical-target: win-x64
            runs-on: windows-latest
            rid: win-x64
          - logical-target: win-arm64
            runs-on: windows-latest
            rid: win-arm64
          - logical-target: linux-x64
            runs-on: ubuntu-latest
            rid: linux-x64
          - logical-target: linux-arm64
            runs-on: ubuntu-24.04-arm
            rid: linux-arm64
          - logical-target: osx-arm64
            runs-on: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.runs-on }}
    # Fail fast instead of letting a hung publish/run reach GitHub's 6h default limit.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Install Linux AOT prerequisites
        if: startsWith(matrix.rid, 'linux-')
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev
      - name: Create local feed dir (NuGet.config local source)
        shell: bash
        run: mkdir -p ./artifacts/nupkg
      - run: dotnet publish PicoJetson/samples/PicoJetson.Sample/PicoJetson.Sample.csproj -c Release -f net10.0 -r ${{ matrix.rid }} --self-contained
      - run: dotnet publish PicoIni/samples/PicoIni.Sample/PicoIni.Sample.csproj -c Release -f net10.0 -r ${{ matrix.rid }} --self-contained
      - run: dotnet publish PicoToml/samples/PicoToml.Sample/PicoToml.Sample.csproj -c Release -f net10.0 -r ${{ matrix.rid }} --self-contained
      - run: dotnet publish PicoYaml/samples/PicoYaml.Sample/PicoYaml.Sample.csproj -c Release -f net10.0 -r ${{ matrix.rid }} --self-contained
      - run: dotnet publish PicoMsgPack/samples/PicoMsgPack.Sample/PicoMsgPack.Sample.csproj -c Release -f net10.0 -r ${{ matrix.rid }} --self-contained

  # The AOT benchmark claim has to be executed, not asserted: the unified MsgPack
  # benchmark silently stopped being able to AOT when its models gained an enum, and
  # nothing noticed because CI only ever ran benchmarks under JIT.
  benchmark-aot:
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Install Linux AOT prerequisites
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev
      - name: Create local feed dir (NuGet.config local source)
        shell: bash
        run: mkdir -p ./artifacts/nupkg
      - name: Publish the AOT MsgPack benchmark
        shell: bash
        run: dotnet publish PicoMsgPack/benchmarks/PicoMsgPack.Benchmarks.Aot/PicoMsgPack.Benchmarks.Aot.csproj -c Release -r linux-x64 -o ./bench-aot
      - name: Run it — both sides must actually be AOT
        shell: bash
        run: ./bench-aot/PicoMsgPack.Benchmarks.Aot
